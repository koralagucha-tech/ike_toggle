name: Build plugin

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: jugeeya/cargo-skyline:3.2.0
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build
        run: |
          export PATH=$PATH:/root/.cargo/bin:/opt/devkitpro/devkitA64/bin
          # The 2022 toolchain (rustc 1.67) is too old for the newest helper
          # libraries, so pin them to older versions that still work.
          cargo update -p quote --precise 1.0.35
          cargo update -p proc-macro2 --precise 1.0.78
          cargo skyline build --release
        env:
          HOME: /root

      - name: Upload plugin
        uses: actions/upload-artifact@v4
        with:
          name: ike_toggle_plugin
          path: target/aarch64-skyline-switch/release/libike_toggle.nro
